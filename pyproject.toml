[project]
name = "frontdesk"
version = "0.1.0"
description = "A customer's records and requests at Quillstack, served to an agent: theirs over MCP, or the one here."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "a2a-sdk[http-server]>=0.3",
    "asyncpg>=0.31.0",
    "deepagents>=0.7.21",
    "fastmcp>=4.0.11",
    "httpx>=0.28",
    "langchain>=1.4",
    "langchain-anthropic>=1.7",
    "langchain-fireworks>=1.0",
    "langchain-openai>=1.7.0",
    "langgraph>=1.2",
    "langgraph-sdk>=0.4.5",
    "langsmith>=0.14.4",
    "pyjwt[crypto]>=2.10",
    "uvicorn>=0.34",
    "langgraph-checkpoint-postgres>=3.1.2",
    "psycopg[binary]>=3.3.6",
]

[dependency-groups]
dev = [
    "langgraph-cli[inmem]>=0.4.33",
    "pytest>=8",
    "pytest-asyncio>=1.0",
]

[project.scripts]
frontdesk = "frontdesk.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/frontdesk"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
