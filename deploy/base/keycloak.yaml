# Keycloak signs the tokens that say who is calling. The realm in realm.json holds the people in
# src/frontdesk/people.py, and scripts/realm.py writes it from that list.
#
# A token's issuer is the address people on this machine use, http://localhost:18080. Services in the cluster fetch
# the signing keys from http://keycloak:8080, which KC_HOSTNAME_BACKCHANNEL_DYNAMIC allows.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
spec:
  replicas: 1
  selector:
    matchLabels: {app: keycloak}
  template:
    metadata:
      labels: {app: keycloak}
    spec:
      containers:
        - name: keycloak
          image: quay.io/keycloak/keycloak:26.4
          args: ["start-dev", "--import-realm"]
          env:
            - {name: KC_HOSTNAME, value: "http://localhost:18080"}
            - {name: KC_HOSTNAME_BACKCHANNEL_DYNAMIC, value: "true"}
            - {name: KC_HTTP_ENABLED, value: "true"}
            - {name: KC_HEALTH_ENABLED, value: "true"}
            - {name: KC_BOOTSTRAP_ADMIN_USERNAME, value: admin}
            - name: KC_BOOTSTRAP_ADMIN_PASSWORD
              valueFrom: {secretKeyRef: {name: keycloak, key: KEYCLOAK_ADMIN_PASSWORD}}
            - name: DEMO_PASSWORD
              valueFrom: {secretKeyRef: {name: keycloak, key: DEMO_PASSWORD}}
            - name: SERVICE_CLIENT_SECRET
              valueFrom: {secretKeyRef: {name: keycloak, key: SERVICE_CLIENT_SECRET}}
            - name: DESK_CLIENT_SECRET
              valueFrom: {secretKeyRef: {name: keycloak, key: DESK_CLIENT_SECRET}}
          ports:
            - containerPort: 8080
            - containerPort: 9000
          readinessProbe:
            httpGet: {path: /health/ready, port: 9000}
            periodSeconds: 5
            failureThreshold: 60
          resources:
            requests: {memory: 512Mi}
            limits: {memory: 1200Mi}
          volumeMounts:
            - {name: realm, mountPath: /opt/keycloak/data/import}
      volumes:
        - name: realm
          configMap: {name: keycloak-realm}
---
apiVersion: v1
kind: Service
metadata:
  name: keycloak
spec:
  type: LoadBalancer
  selector: {app: keycloak}
  ports:
    - {name: http, port: 18080, targetPort: 8080}
    - {name: cluster, port: 8080, targetPort: 8080}
