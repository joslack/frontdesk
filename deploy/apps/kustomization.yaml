# The applications: the access server, the two LangGraph Server deployments, the dispatcher, the retention desk, and the rules for who
# may reach whom. They need what deploy/base starts, the Secrets from scripts/cluster_secrets.py, and the images
# from `make images`.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: frontdesk
resources:
  - access.yaml
  - desk.yaml
  - jobs.yaml
  - dispatcher.yaml
  - retention.yaml
  - network.yaml
